name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/aur_scanner-${GITHUB_REF_NAME}.zip" \
            bin lib docs scripts LICENSE README.md || true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist || exit 0
          ls -1 | grep -v '^SHA256SUMS$' | xargs -r sha256sum > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aur_scanner-${{ github.ref_name }}.zip
            dist/SHA256SUMS
