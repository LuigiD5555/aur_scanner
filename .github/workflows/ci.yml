name: CI
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git nodejs npm bats shellcheck python

      - name: ShellCheck
        run: |
          mapfile -t files < <(git ls-files | grep -E '(^bin/(aur-verify|aur-guard)$|\.sh$)')
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck "${files[@]}"
          fi

      - name: Node smoke test
        run: |
          if [ -f bin/pkgb-parse ]; then
            node bin/pkgb-parse --help || true
          else
            echo "No pkgb-parse CLI found, skipping."
          fi

      - name: Run test suite
        run: bash scripts/run-tests.sh
