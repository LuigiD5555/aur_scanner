name: CI
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm sudo git nodejs npm bats shellcheck

      - name: ShellCheck
        run: shellcheck bin/* lib/* scripts/* || true

      - name: Setup Node
        run: |
          node --version
          npm --version

      - name: Node smoke test
        run: |
          if [ -f bin/pkgb-parse ]; then
            node bin/pkgb-parse --help || true
          else
            echo "No pkgb-parse CLI found, skipping."
          fi

      - name: Create needed directories
        run: mkdir -p bin lib scripts

      - name: List directories for verification
        run: ls -la bin lib scripts

      - name: Run test suite
        run: bash scripts/run-tests.sh
