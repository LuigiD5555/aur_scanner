name: Beta Release Maintenance

on:
  push:
    branches: [ beta-release ]
  workflow_dispatch: {}

jobs:
  prepare-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git tar zstd

      - name: Packaging smoke test
        run: |
          set -euo pipefail
          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT

          PKGBUILD_DIR="packaging/aur-scanner-git"
          if [[ ! -d "$PKGBUILD_DIR" ]]; then
            echo "[beta-qa] packaging directory missing" >&2
            exit 1
          fi

          mkdir -p "$WORK_DIR/aur-scanner-git"
          cp -a "$PKGBUILD_DIR/." "$WORK_DIR/aur-scanner-git/"

          pushd "$WORK_DIR/aur-scanner-git" >/dev/null
          export PKGDEST="$WORK_DIR/pkgdest"
          mkdir -p "$PKGDEST"

          makepkg -Ccsf
          PKG_FILE=$(makepkg --packagelist)
          popd >/dev/null

          if [[ ! -f "$PKG_FILE" ]]; then
            echo "[beta-qa] makepkg did not produce a package" >&2
            exit 1
          fi

          PKGROOT="$WORK_DIR/pkgroot"
          mkdir -p "$PKGROOT"
          tar -xf "$PKG_FILE" -C "$PKGROOT"

          export PATH="$PKGROOT/usr/bin:$PATH"
          if ! command -v aur-verify >/dev/null; then
            echo "[beta-qa] aur-verify binary missing in produced package" >&2
            exit 1
          fi
          if ! command -v scan >/dev/null; then
            echo "[beta-qa] scan binary missing in produced package" >&2
            exit 1
          fi
          if ! aur-verify --help | grep -q "Usage: aur-verify.sh"; then
            echo "[beta-qa] aur-verify --help does not print expected banner" >&2
            exit 1
          fi

          echo "[beta-qa] Packaging smoke test passed."

      - name: Prune development assets and rewrite docs
        run: |
          set -euo pipefail

          repo_url=$(git config --get remote.origin.url)
          repo_url=${repo_url%.git}
          repo_url=${repo_url/git@github.com:/https://github.com/}
          dev_en="$repo_url/blob/development/docs/developer/README.dev.md"
          dev_es="$repo_url/blob/development/docs/developer/README.dev.es.md"

          python3 - <<PY
from pathlib import Path

dev_en = "${dev_en}"
dev_es = "${dev_es}"

readme_paths = [Path("README.md"), Path("docs/es/README.es.md")]
for path in readme_paths:
    if not path.exists():
        continue
    text = path.read_text()
    new_text = text.replace("(docs/developer/README.dev.md)", f"({dev_en})")
    new_text = new_text.replace("(docs/developer/README.dev.es.md)", f"({dev_es})")
    lines = [line for line in new_text.splitlines() if "install-scanner.sh" not in line]
    updated = "\n".join(lines)
    if new_text.endswith("\n"):
        updated += "\n"
    if updated != text:
        path.write_text(updated)

index_path = Path("docs/INDEX.md")
if index_path.exists():
    data = index_path.read_text()
    updated = data.replace("`../README.dev.md`", f"<{dev_en}>")
    updated = updated.replace("`../README.dev.es.md`", f"<{dev_es}>")
    if updated != data:
        index_path.write_text(updated)
PY

          to_remove=(
            docs/developer
            tests
            scripts/run-tests.sh
            scripts/sync-development.sh
          )
          for path in "${to_remove[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -rf "$path" || rm -rf "$path"
            fi
          done

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes if needed
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(beta): prune dev assets and update docs"
          else
            echo "No changes to commit."
          fi

      - name: Push changes
        run: |
          if [ -n "$(git log --branches --not --remotes --oneline)" ]; then
            git push origin HEAD
          else
            echo "Nothing to push."
          fi
