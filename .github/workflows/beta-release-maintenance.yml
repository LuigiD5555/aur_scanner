name: Beta Release Maintenance

on:
  push:
    branches: [ beta-release ]
  workflow_dispatch: {}

jobs:
  prepare-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git tar zstd python

      - name: Packaging smoke test
        run: bash .github/workflows/beta_yay_smoke.sh

      - name: Prune development assets and rewrite docs
        if: always()
        run: |
          set -euo pipefail

          chmod +x .github/scripts/prepare_release_docs.py
          python3 .github/scripts/prepare_release_docs.py

          to_remove=(
            tests
            scripts/run-tests.sh
            scripts/sync-development.sh
          )
          for path in "${to_remove[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -rf "$path" || rm -rf "$path"
            fi
          done

      - name: Configure git user
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes if needed
        if: always()
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(beta): prune dev assets and update docs"
          else
            echo "No changes to commit."
          fi

      - name: Push changes
        if: always()
        run: |
          if [ -n "$(git log --branches --not --remotes --oneline)" ]; then
            git push origin HEAD
          else
            echo "Nothing to push."
          fi
